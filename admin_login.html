<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVPN+ Admin Portal | Login</title>
    <link rel="stylesheet" href="css/admin_style.css">
</head>
<body>
    <div class="wallpaper-veil"></div>

    <div class="login-container">
        <div class="glass-panel login-card">
            <div class="login-header">
                <div class="brand-icon-box">
                    <svg class="svg-icon svg-icon-lg" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1>CloudVPN<span>+</span></h1>
                <p>Administrative Control Center Authentication</p>
            </div>

            <!-- Dynamic Alert Container -->
            <div id="loginAlert" class="alert alert-danger" style="display: none;">
                <svg class="svg-icon" style="color: var(--danger-red);" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
                <span id="loginAlertMessage">Authentication error</span>
            </div>

            <form id="adminLoginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="adminIdentityInput">
                        <span>Admin Identity / Email</span>
                        <span class="form-label-hint">e.g. root or admin@cloudvpn.com</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input 
                            type="text" 
                            id="adminIdentityInput" 
                            class="form-input" 
                            placeholder="Enter root or admin email" 
                            required 
                            autocomplete="username"
                        />
                    </div>
                    <div id="identityError" class="form-error-msg"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminPasswordInput">
                        <span>Master Password</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input 
                            type="password" 
                            id="adminPasswordInput" 
                            class="form-input" 
                            placeholder="Enter administrative password" 
                            required 
                            autocomplete="current-password"
                        />
                        <button type="button" id="btnTogglePassword" class="password-toggle" title="Toggle password visibility">
                            <svg id="iconEyeOpen" class="svg-icon" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="iconEyeClosed" class="svg-icon" style="display: none;" viewBox="0 0 24 24">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <div id="passwordError" class="form-error-msg"></div>
                </div>

                <div style="margin-top: 1.75rem;">
                    <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-block">
                        <span id="btnLoginText">Authenticate &amp; Launch Dashboard</span>
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); text-align: center;">
                <div style="font-size: 0.75rem; color: var(--text-light); font-weight: 500;">
                    Secure Nonce SHA-256 Handshake Protocol &bull; HTTP Native
                </div>
            </div>
        </div>
    </div>

    <!-- Script Dependencies -->
    <script src="js/sha256.js"></script>
    <script src="js/admin_api.js"></script>
    <script src="js/admin_auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already logged in, redirect to dashboard
            const existingSession = AdminAuth.getSession();
            if (existingSession) {
                window.location.href = 'admin_dashboard.html';
                return;
            }

            const loginForm = document.getElementById('adminLoginForm');
            const identityInput = document.getElementById('adminIdentityInput');
            const passwordInput = document.getElementById('adminPasswordInput');
            const identityError = document.getElementById('identityError');
            const passwordError = document.getElementById('passwordError');
            const loginAlert = document.getElementById('loginAlert');
            const loginAlertMessage = document.getElementById('loginAlertMessage');
            const btnSubmit = document.getElementById('btnLoginSubmit');
            const btnLoginText = document.getElementById('btnLoginText');
            const btnTogglePassword = document.getElementById('btnTogglePassword');
            const iconEyeOpen = document.getElementById('iconEyeOpen');
            const iconEyeClosed = document.getElementById('iconEyeClosed');

            // Password Toggle
            btnTogglePassword.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    iconEyeOpen.style.display = 'none';
                    iconEyeClosed.style.display = 'inline-block';
                } else {
                    passwordInput.type = 'password';
                    iconEyeOpen.style.display = 'inline-block';
                    iconEyeClosed.style.display = 'none';
                }
            });

            // Input Validation Events
            identityInput.addEventListener('input', () => {
                identityInput.classList.remove('is-invalid');
                identityError.classList.remove('visible');
                loginAlert.style.display = 'none';
            });

            passwordInput.addEventListener('input', () => {
                passwordInput.classList.remove('is-invalid');
                passwordError.classList.remove('visible');
                loginAlert.style.display = 'none';
            });

            // Form Submit Handler
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const identity = identityInput.value.trim();
                const password = passwordInput.value;

                // Validate Identity (email or root)
                const idValidation = AdminAuth.validateAdminIdentity(identity);
                if (!idValidation.isValid) {
                    identityInput.classList.add('is-invalid');
                    identityError.textContent = idValidation.message;
                    identityError.classList.add('visible');
                    identityInput.focus();
                    return;
                }

                // Validate Password
                const pwValidation = AdminAuth.validatePassword(password);
                if (!pwValidation.isValid) {
                    passwordInput.classList.add('is-invalid');
                    passwordError.textContent = pwValidation.message;
                    passwordError.classList.add('visible');
                    passwordInput.focus();
                    return;
                }

                // Lock UI during authentication
                btnSubmit.disabled = true;
                btnLoginText.textContent = 'Verifying Admin Nonce...';
                loginAlert.style.display = 'none';

                try {
                    const result = await AdminAuth.login(identity, password);
                    if (result.success) {
                        btnLoginText.textContent = 'Authenticated. Entering Dashboard...';
                        setTimeout(() => {
                            window.location.href = 'admin_dashboard.html';
                        }, 400);
                    } else {
                        loginAlertMessage.textContent = result.message || 'Authentication failed.';
                        loginAlert.style.display = 'flex';
                        btnSubmit.disabled = false;
                        btnLoginText.textContent = 'Authenticate & Launch Dashboard';
                    }
                } catch (err) {
                    loginAlertMessage.textContent = err.message || 'Connection error with backend server.';
                    loginAlert.style.display = 'flex';
                    btnSubmit.disabled = false;
                    btnLoginText.textContent = 'Authenticate & Launch Dashboard';
                }
            });
        });
    </script>
</body>
</html>
